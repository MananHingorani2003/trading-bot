[project]
name = "trading-terminal"
version = "0.0.1"
description = "AI-driven swing trading terminal for Indian equities (Zerodha)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=16.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "anthropic>=0.40",
    "feedparser>=6.0",
]

[project.optional-dependencies]
live = [
    "kiteconnect>=5.0",
    "chromadb>=0.5",
    "python-telegram-bot>=21",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
tt = "trading.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
