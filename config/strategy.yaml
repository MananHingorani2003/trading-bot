version: 0.1.0

portfolio:
  capital: 50000          # INR — paper capital
  max_positions: 8        # 6 core + 2 aggressive (tuned up from 7 after week 1 review)
  max_pct_per_position: 0.14  # tightened from 0.18 — smaller individual bets
  reserve_cash_pct: 0.10

risk:
  default_stop_loss_pct: 0.05   # tightened from 0.06 — pair with smaller positions
  default_target_r_multiple: 2.0
  daily_loss_halt_pct: 0.03
  weekly_loss_halt_pct: 0.07
  no_average_down: true

sleeves:
  # Core: stable trend-followers. Most of the book.
  core:
    capital_pct: 0.80          # 80% of total capital reserved for core
    max_positions: 6           # up from 5 — more diversification
    max_pct_per_position: 0.12 # of TOTAL capital (down from 0.18)
    stop_loss_pct: 0.05        # down from 0.06
    target_r_multiple: 2.0
    # Volume floor added after week 1 — FINCABLES at 0.13x avg was the
    # tell-tale on a losing trade; require at least near-average volume.
    min_volume_surge: 0.7
  # Aggressive: news-catalyst breakouts. Smaller stocks OK. Tighter stops.
  aggressive:
    capital_pct: 0.20          # 20% of total capital
    max_positions: 2
    max_pct_per_position: 0.10 # of TOTAL capital (so <= sleeve cap)
    stop_loss_pct: 0.04        # tight — risky setups die fast
    target_r_multiple: 3.0     # asymmetric — these can run
    min_market_cap_cr: 200     # smaller names allowed
    min_avg_daily_value_cr: 2  # lower liquidity floor (still tradeable)
    require_news_hours: 48     # must have headline in last N hours
    breakout_lookback_days: 20 # close must exceed prior N-day high
    min_volume_surge: 1.8      # today's volume / 20d avg
    rsi_max: 80
  # Analyst-signal sleeve: follows SEBI-registered Telegram channels verbatim.
  # No AI reasoning — pure signal-following. Uses analyst's own stop/target.
  analyst_signal:
    capital_pct: 0.20          # 20% capital reserved for signal channels
    max_positions: 4           # diversify across signals
    max_pct_per_position: 0.05 # ~₹2500/trade at 50k capital
    # Stop/target come from the signal itself, not our defaults

signal_sources:
  lemonnhq:
    enabled: true
    channel: "LemonnHQ"        # https://t.me/LemonnHQ
    only_kinds: ["STOCKS"]     # drop F&O
    only_products: ["DELIVERY"]
    max_age_minutes: 720       # ignore signals older than 12 hours

universe:
  source: nifty500
  min_price: 50
  min_market_cap_cr: 500
  min_avg_daily_value_cr: 5
  blacklist:
    - "*-BE"     # T2T segment
    - "*-BZ"
    - "DUMMY*"   # NSE corporate-action placeholders (Vedanta demerger etc.)
    - "NIFTY*"   # index symbols sometimes appear in lists

filters:
  earnings_blackout_days: 2
  skip_circuit_locked_within_days: 5

signals:
  trend:
    enabled: true
    fast_ema: 20
    slow_ema: 50
    adx_min: 20
  mean_revert:
    enabled: false
    rsi_low: 30
    rsi_high: 70
